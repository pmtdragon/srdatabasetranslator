<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер акрина и кораблей</title>
    <style>
        body {
            background: -webkit-linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
			background: -moz-linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
			background: -o-linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
			background: -ms-linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
			background: linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
            color: #d1d1d1;
            font-family: 'Arial', sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }
        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            overflow: auto;
            padding: 15px;
            background-color: #2e2e2e;
            color: #afafaf;
            border: 1px solid #afafaf;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        #output {
            min-height: 320px;
            background-color: #333;
            color: #afafaf;
            border: 1px solid #afafaf;
            border-radius: 8px;
            font-size: 16px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            width: 100%;
        }
        button {
            background-color: #1e1e1e;
            color: #afafaf;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        button:hover {
            background-color: #afafaf;
            color: #1e1e1e;
            transform: scale(1.05);
        }
        .message {
            display: none;
            margin-top: 10px;
            color: #66bb6a;
            text-align: center;
            font-size: 14px;
        }
        #notification {
            display: none;
            margin-top: 10px;
            color: #66bb6a;
            text-align: center;
            font-size: 14px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .tab {
            background-color: #2e2e2e;
            color: #afafaf;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            border: 1px solid transparent;
        }
        .tab:hover {
            background-color: #afafaf;
            color: #1e1e1e;
        }
        .tab.active {
            background-color: #afafaf;
            color: #1e1e1e;
            border: 1px solid #1e1e1e;
        }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab active" onclick="changeTab('index.html')">Акрины</div>
        <div class="tab" onclick="changeTab('mm_convertor.html')">Mикромодули</div>
        <div class="tab" onclick="changeTab('guns_convertor.html')">Оружие</div>
        <div class="tab" onclick="changeTab('hulls_serie_convertor.html')">Серии корпусов</div>
        <div class="tab" onclick="changeTab('frequency_calculator.html')">Частота кадров</div>
    </div>
    <h1>Конвертер акрина</h1>
    <div class="center-container">
        <div class="input-area">	
			<textarea id="input" placeholder="Вставьте один акрин оружия/оборудования/корпуса из Lang.dat здесь..."></textarea>
			<div>
			<button id="convert">Convert</button>
			<button id="copy">Copy</button>
			<button id="reset">Reset</button>
            </div>			
			<div class="message" id="notification">Успешно скопировано в буфер обмена</div>
		</div>
		<textarea id="output" readonly placeholder="Здесь появятся результаты..."></textarea>
    </div>

    <script>
        function changeTab(page) {
            // Изменение активной вкладки
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Перенаправление на выбранную страницу
            window.location.href = page;
        }
		
        document.getElementById('convert').addEventListener('click', function() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            let result = '';

            // Обработка текста
			const sizeMatch = input.match(/(?<!\w)Size=\+?(-?\d+)/); //чтобы на HullGraphSize не триггерилось
            const nameMatch = input.match(/Name=(.+)/);
            const fragilityMatch = input.match(/Fragility=\+?(-?\d+)/);
			const equipMatch = input.match(/Equipments=(.*)/);
            const ownerMatch = input.match(/Owner=(.+)/);
			
			// Обработка Name
            if (!nameMatch) {
                result += '⚠️Внимание: название акрина не найдено!\n';
            } else {
                result += `Акрин: ${nameMatch[1]}\n`;
            }

            // Проверка BlockMM
			const blockMMMatch = input.match(/BlockMM=\+?(-?\d+)/);
            if (blockMMMatch) {
                const blockMMValue = blockMMMatch[1];
                if (blockMMValue === '1') {
                    result += "Несовместим с микромодулями\n";
	            } else if (blockMMValue === '0') {
                result += "🔎Если это оригинальный акрин, не обращайте внимания. Если это мод на ребаланс - 'BlockMM' 0 может использоваться для обнуления штрафа оригинала.\n";				
                } else if (blockMMValue === '' || blockMMValue < 0 || blockMMValue > 1) {
                    result += "⚠️Ошибка! Допустимые значения 'BlockMM': '1' или '0'\n";
                }
            }

            // Проверка BlockImp
			const blockImpMatch = input.match(/BlockImp=\+?(-?\d+)/);
            if (blockImpMatch) {
                const blockImpValue = blockImpMatch[1];
                if (blockImpValue === '1') {
                    result += "Не может быть улучшен на научной базе\n";
	            } else if (blockImpValue === '0') {
                result += "🔎Если это оригинальный акрин, не обращайте внимания. Если это мод на ребаланс - 'BlockImp' 0 может использоваться для обнуления штрафа оригинала.\n";	
                } else if (blockImpValue === '' || blockImpValue < 0 || blockImpValue > 1) {
                    result += "⚠️Ошибка! Допустимые значения 'BlockImp': '1' или '0'\n";
                }
            }
			
			// Обработка Owner //
			if (!ownerMatch) {
			result += "Встречается производства: Maloc, Peleng, People, Fei, Gaal, PirateClan (если акрин выдается скриптом, рекомендуется проверить производителей вручную)\n"; // Если Owner не найден, значит подойдет к этим расам
			} else {
			let ownerValue = ownerMatch[1].replace(/,/g, ', '); // Форматируем значение Owner
			let races = ownerValue; // Начинаем с найденных рас
			
			if (ownerValue.includes("Nothing")) {
			result += "'Owner' 'Nothing' вероятно, означает размещение предмета в магазинах и раздачу ему рас скриптом\n";
			}			
			
			// Проверка на наличие "Any" и другого слова
			if (ownerValue.includes("Any") && ownerValue.split(',').length > 1) {
			result += "⚠️Внимание! 'Owner' не может быть одновременно 'Any' + 'другой Owner'. Требуется ручная проверка!\n";
			}

			// Замена "Any" на нужные расы
			if (races.includes("Any")) {
			races = "Maloc, Peleng, People, Fei, Gaal, PirateClan"; // Заменяем "Any" на указанные расы
			}

			result += "Встречается производства: " + races + '\n'; // Выводим результат
			}
			
			// Обработка OnPlanets
			const onPlanetsMatch = input.match(/OnPlanets=\+?(-?\d+)/);
			let onPlanetsWarningSpace = ""; // Переменная для хранения предупреждения
			let onPlanetsWarning = ""; // Переменная для хранения предупреждения, в коде дальше выводится в самом низу всех строк, чтобы не мешало
			if (onPlanetsMatch) {
				const onPlanetsValue = onPlanetsMatch[1];

				if (onPlanetsValue === '1') {
					result += "Продается на планетах расы-производителя: да\n";
					onPlanetsWarningSpace = "--------------------------\n";
					onPlanetsWarning = "🔎Если это акрин орудия, обязательно см. 'StoreAvailability' базовой пушки. Если ее 'StoreAvailability' имеет ограничение по расе или фракции ('MalocOnly', 'PelengOnly', 'PeopleOnly', 'FeiOnly', 'GaalOnly', 'PirateOnly', 'CoalitionOnly'), то в акрине валидным считается только значение 'Owner', подходящее под такие ограничения (не подходящие расы в 'Owner' акрина работать не будут). Если в акрине не будет найден 'Owner', совпадающий с расой в 'StoreAvailability' базового орудия, это приведет к тому, что акрин никогда не попадет в магазин! Если 'StoreAvailability' базовой пушки не ограничивает продажу для определенной расы или фракции (или это не акрин орудия) не обращайте внимания на это предупреждение🔎\n";
				} else if (onPlanetsValue === '0') {
					result += "Продается на планетах: нет\n";
				} else if (onPlanetsValue === '' || parseInt(onPlanetsValue) < 0 || parseInt(onPlanetsValue) > 1) {
					result += "⚠️Ошибка! Допустимые значения 'OnPlanets': '1' или '0'\n";
				}
			} else {
				result += "Продается на планетах: нет\n"; // Если OnPlanets не найдено, игра считает, что акрин не встречается на планетах
			}
			
			//Для акриновых корпусов флаг OnPlanets=1 означает продажу на любых планетах независимо от 'Owner'
			if (input.includes("Equipments=Hull") && input.includes("OnPlanets=1")) {
				if (result.includes("Продается на планетах расы-производителя: да")) {
					result = result.replace("Продается на планетах расы-производителя: да", "Продается на планетах: малоков, пеленгов, людей, фэян, гаальцев, пиратов");
				}
			}

			//На случай если в акрине в 'Equipments' выставлено 'Hull' и одновременно другое оборудование при флаге 'OnPlanets=1' (чтобы условия продажи не перепутались). Такого не должно встречаться вовсе, но проверка не помешает
			if (equipMatch) {
				const equipments = equipMatch[1].trim();
				const hasHull = equipments.includes("Hull");
				const otherEquipExists = equipments.split(',').some(e => e.trim() !== "Hull");

				if (hasHull && otherEquipExists && onPlanetsMatch && onPlanetsMatch[1] === '1') {
					result += "⚠️Внимание: в 'Equipments' одновременно присутствует 'Hull' и иной тип оборудования при активном флаге 'OnPlanets=1'. Рекомендуется проверить места продажи вручную.\n";
				}
			}

			// Проверка на наличие StoreAvailability
			if (input.includes("StoreAvailability=")) {
				result += "⚠️Ошибка! В акринах параметр 'StoreAvailability' не используется. Он предназначен для базовых орудий\n";
			}

            // Обработка RacialRestriction
            const racialRestrictionMatch = input.match(/RacialRestriction=\+?(-?\d*)/);
            if (racialRestrictionMatch) {
                const racialValue = racialRestrictionMatch[1];

                if (racialValue === '1') {
                    result += "Бонусы акрина работают только для расы производителя.\n";
                } else if (racialValue === '0') { //вообще то вывод сообщения при 0 лучше делать на случай если акрин или ребаланс перезаписывает расовый запрет
                    // Просто переходим к следующему коду
                } else if (racialValue === '' || racialValue < 0 || racialValue > 1) {
                    result += "⚠️Внимание! 'RacialRestriction' может быть лишь '1' или '0'. Требуется ручная проверка!\n";
                }
            }
			
            // Обработка Ruins
            const ruinsMatch = input.match(/Ruins=(.*)/);
            if (ruinsMatch) {
                const ruinsValue = ruinsMatch[1].trim();
                if (ruinsValue === '' || ruinsValue === 'None') {
                    result += "Продается на станциях: нет\n"; //отсутствие значения в Ruins в акринах игра трактует как запрет продажи на станциях
                } else {
                    const ruinsList = ruinsValue.split(',').map(item => item.trim());
                    result += `Продается на станциях: ${ruinsList.join(', ')}\n`;
                }
            } else {
                result += "Продается на станциях: нет\n"; //отсутствие Ruins в акринах игра трактует как запрет продажи на станциях
            }

			// Обработка Priority
			const priorityMatch = input.match(/Priority=\+?(\d+)/);
			if (!priorityMatch) {
				result += "⚠️Внимание! Отсутствует параметр 'Priority', требуется ручная проверка!\n";
			} else {
				const priorityValue = parseInt(priorityMatch[1]);
				if (isNaN(priorityValue) || priorityValue < 0 || priorityValue > 100) {
					result += "⚠️Внимание! 'Priority' должен быть в диапазоне от 1 до 100. Требуется ручная проверка!\n";
				} else {
					const gtu = Math.ceil(8 * priorityValue * 0.01);
					result += `Встречается с ${gtu} ГТУ\n`;
				}
			}

				// Расчет стоимости
				if (!input.includes("Cost=")) {
					// Если выражение не найдено, продолжаем выполнение кода ниже
				} else {
					// Обработка стоимости
					const costMatch = input.match(/Cost=(-?\d+)/);
					if (costMatch) {
						const PRICE = parseInt(costMatch[1]);
						if (PRICE <= 0) {
							result += "⚠️Внимание! Числовое значение 'Cost' не соответствует ожидаемому, требуется ручная проверка.\n";
						} else if (PRICE === 100) {
						result += "🔎Если это оригинальный акрин, не обращайте внимания. Если это мод на ребаланс - 'Cost' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n";
						} else if (PRICE < 100) {
							const PR = 100 - PRICE;
							result += `Стоимость: -${PR}%\n`;
						} else {
							const PR = PRICE - 100;
							result += `Стоимость: +${PR}%\n`;
						}
					}
				}

				// Обработка Fragility
				if (fragilityMatch) {
					let B = parseInt(fragilityMatch[1].replace('+', '')); // Убираем знак +, если он есть
					if (B < 0 || isNaN(B)) {
						result += "⚠️Ошибка: 'Fragility' < 0. Рекомендуется ручная проверка.\n";
					} else if (B === 100) {
						result += "🔎Если это оригинальный акрин, не обращайте внимания. Если это мод на ребаланс - 'Fragility' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n";
					} else {
						const equipExists = equipMatch && equipMatch[1].trim();
						const hasHull = equipExists && equipExists.includes("Hull");
						const otherEquipExists = equipExists && equipExists.split(',').some(e => e.trim() !== "Hull");

						if (hasHull && otherEquipExists) {
							// Чтобы выводились и сопротивления и надежность оборудования, если в Equipments есть и корпус и любое оборудование разом
							if (B === 0) {
								result += "Иммунитет к э/о/р урону.\n";
								result += "Надежность: вечная.\n";
							} else {
								const Y = (B > 100) ? (100 - B) * -1 : (100 - B);
								let reliabilityX = (B > 100) ? (100 / B * 100) - 100 : (100 / B * 100) - 100; // Вычисляем надежность без округления
								let formattedReliabilityX = (B > 199999) ? reliabilityX : reliabilityX.toFixed(1); // Округляем перед выводом, если B <= 199999, иначе выдаем неокругленное, чтобы засейвиться от значений "Надежность -100%"
								result += (B > 100) ? `Уязвимость к э/о/р урону: +${Y}%\n` : `Сопротивление э/о/р урону: +${Y}%\n`;
								result += (B > 100) ? `Надежность: ${formattedReliabilityX}%\n` : `Надежность: +${formattedReliabilityX}%\n`;
							}
						} else if (hasHull) {
							// Если в Equipments только корпус, а оборудования нет, выводятся только данные о корпусе
							if (B === 0) {
								result += "Иммунитет к э/о/р урону.\n";
							} else {
								const Y = 100 - B;
								result += (B < 100) ? `Сопротивление э/о/р урону: +${Y}%\n` : `Уязвимость к э/о/р урону: +${(Y) * -1}%\n`;
							}
						} else if (otherEquipExists) {
							// Если в Equipments только оборудование, а корпуса не прописано, выводятся только данные о надежности оборудования
								const reliabilityX = (B > 100) ? (100 / B * 100) - 100 : (100 / B * 100) - 100;
								let formattedReliabilityX = (B > 199999) ? reliabilityX : reliabilityX.toFixed(1); // Округляем перед выводом, если B <= 199999, иначе выдаем неокругленное, чтобы засейвиться от значений "Надежность -100%"
								result += (B === 0) ? "Надежность: вечная.\n" : (formattedReliabilityX > 0 ? `Надежность: +${formattedReliabilityX}%\n` : `Надежность: ${formattedReliabilityX}%\n`);
						}
					}
				} else if (input.includes("Fragility=")) {
					result += "⚠️Ошибка! Значение 'Fragility' не указано. Требуется ручная проверка.\n";
				}		

			// Обработка FragilityEnergy
			const fragilityEnergyMatch = input.match(/FragilityEnergy=\+?(-?\d+)/);
			if (fragilityEnergyMatch) {
				let ENR = parseInt(fragilityEnergyMatch[1].replace('+', '')); // Убираем знак +, если он есть
				const equipExists = equipMatch && equipMatch[1].trim();
				const hasHull = equipExists && equipExists.includes("Hull");

				if (hasHull) {
					if (ENR > 0 && ENR < 100) {
						const Y = 100 - ENR;
						result += `Сопротивление к энерг. урону: +${Y}%\n`;
					} else if (ENR > 100) {
						const Y = (100 - ENR) * -1;
						result += `Уязвимость к энерг. урону: +${Y}%\n`;
					} else if (ENR === 0) {
						result += "Иммунитет к энерг. урону\n";
					} else if (ENR < 0) {
						result += "⚠️Ошибка: 'FragilityEnergy' < 0. Рекомендуется ручная проверка.\n";
					} else if (ENR === 100) {
						result += "🔎Если это оригинальный акрин, не обращайте внимания. Если это мод на ребаланс - 'FragilityEnergy' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n";
					}
				}
			} else if (input.includes("FragilityEnergy=")) {
				// Если строка FragilityEnergy найдена, но значение не указано
				const equipExists = equipMatch && equipMatch[1].trim();
				const hasHull = equipExists && equipExists.includes("Hull");
				if (hasHull) {
					result += "⚠️Ошибка! Значение 'FragilityEnergy' не указано. Требуется ручная проверка\n";
				}
			}
			
			// Обработка FragilitySplinter
			const FragilitySplinterMatch = input.match(/FragilitySplinter=\+?(-?\d+)/);
			if (FragilitySplinterMatch) {
				let SPL = parseInt(FragilitySplinterMatch[1].replace('+', '')); // Убираем знак +, если он есть
				const equipExists = equipMatch && equipMatch[1].trim();
				const hasHull = equipExists && equipExists.includes("Hull");

				if (hasHull) {
					if (SPL > 0 && SPL < 100) {
						const Y = 100 - SPL;
						result += `Сопротивление к оскол. урону: +${Y}%\n`;
					} else if (SPL > 100) {
						const Y = (100 - SPL) * -1;
						result += `Уязвимость к оскол. урону: +${Y}%\n`;
					} else if (SPL === 0) {
						result += "Иммунитет к оскол. урону\n";
					} else if (SPL < 0) {
						result += "⚠️Ошибка: 'FragilitySplinter' < 0. Рекомендуется ручная проверка.\n";
					} else if (SPL === 100) {
						result += "🔎Если это оригинальный акрин, не обращайте внимания. Если это мод на ребаланс - 'FragilitySplinter' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n";
					}
				}
			} else if (input.includes("FragilitySplinter=")) {
				// Если строка FragilitySplinter найдена, но значение не указано
				const equipExists = equipMatch && equipMatch[1].trim();

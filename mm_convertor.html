<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер микромодулей</title>
    <style>
        body {
            background: -webkit-linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
			background: -moz-linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
			background: -o-linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
			background: -ms-linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
			background: linear-gradient(135deg, rgb(30, 30, 30), rgb(46, 46, 46));
            color: #d1d1d1;
            font-family: 'Arial', sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }
        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            overflow: auto;
            padding: 15px;
            background-color: #2e2e2e;
            color: #afafaf;
            border: 1px solid #afafaf;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        #output {
            min-height: 320px;
            background-color: #333;
            color: #afafaf;
            border: 1px solid #afafaf;
            border-radius: 8px;
            font-size: 16px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            width: 100%;
        }
        button {
            background-color: #1e1e1e;
            color: #afafaf;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        button:hover {
            background-color: #afafaf;
            color: #1e1e1e;
            transform: scale(1.05);
        }
        .message {
            display: none;
            margin-top: 10px;
            color: #66bb6a;
            text-align: center;
            font-size: 14px;
        }
        #notification {
            display: none;
            margin-top: 10px;
            color: #66bb6a;
            text-align: center;
            font-size: 14px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .tab {
            background-color: #2e2e2e;
            color: #afafaf;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            border: 1px solid transparent;
        }
        .tab:hover {
            background-color: #afafaf;
            color: #1e1e1e;
        }
        .tab.active {
            background-color: #afafaf;
            color: #1e1e1e;
            border: 1px solid #1e1e1e;
        }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab" onclick="changeTab('index.html')">Акрины</div>
        <div class="tab active" onclick="changeTab('mm_convertor.html')">Mикромодули</div>
        <div class="tab" onclick="changeTab('guns_convertor.html')">Оружие</div>
        <div class="tab" onclick="changeTab('hulls_serie_convertor.html')">Серии корпусов</div>
        <div class="tab" onclick="changeTab('frequency_calculator.html')">Частота кадров</div>
    </div>
    <h1>Конвертер микромодулей</h1>
    <div class="center-container">
        <div class="input-area">	
			<textarea id="input" placeholder="Вставьте один микромодуль из Lang.dat здесь..."></textarea>
			<div>
			<button id="convert">Convert</button>
			<button id="copy">Copy</button>
			<button id="reset">Reset</button>
            </div>			
			<div class="message" id="notification">Успешно скопировано в буфер обмена</div>
		</div>
		<textarea id="output" readonly placeholder="Здесь появятся результаты..."></textarea>
    </div>

    <script>
        function changeTab(page) {
            // Изменение активной вкладки
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Перенаправление на выбранную страницу
            window.location.href = page;
        }
		
        document.getElementById('convert').addEventListener('click', function() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            let result = '';

            // Обработка текста
			const sizeMatch = input.match(/(?<!\w)Size=\+?(-?\d+)/);
            const nameMatch = input.match(/Name=(.+)/);
            const fragilityMatch = input.match(/Fragility=\+?(-?\d+)/);
			const equipMatch = input.match(/Equipments=(.*)/);
            const ownerMatch = input.match(/Owner=(.+)/);
            const racialRestrictionMatch = input.match(/RacialRestriction=(.+)/);
			
			// Обработка Name
            if (!nameMatch) {
                result += '⚠️Внимание: название не найдено!\n';
            } else {
                result += `Микромодуль: ${nameMatch[1]}\n`;
            }
			
			// Обработка Owner
			if (!ownerMatch) {
			result += "Раса: Gaal, Fei, Pirate, Maloc, Peleng, People, Kling\n"; // Если Owner не найден, значит подойдет к этим расам
			} else {
			let ownerValue = ownerMatch[1].replace(/,/g, ', '); // Форматируем значение Owner
			let races = ownerValue; // Начинаем с найденных рас
			
			// Проверка на наличие "Any" и другого слова
			if (ownerValue.includes("Any") && ownerValue.split(',').length > 1) {
			result += "⚠️Внимание! Раса ММ не может быть одновременно 'Any' + 'другой Owner'. Требуется ручная проверка!\n";
			}

			// Замена "Any" на нужные расы
			if (races.includes("Any")) {
			races = "Maloc, Peleng, People, Fei, Gaal, Pirate"; // Заменяем "Any" на указанные расы
			}

			// Если "Kling" в Owner не найден
			if (!ownerValue.includes("Kling")) {
			// И "NonKling" в Owner не найден
			if (!ownerValue.includes("NonKling")) {
            races += ", Kling"; // то добавляем "Kling", т.к. отсутствие запрета на установку в доминаторское оборудование движок трактует как разрешение
				}
			}

			result += "Раса: " + races + '\n'; // Выводим результат
			}
			
            // Проверка RacialRestriction
            if (racialRestrictionMatch) {
                const racialValue = racialRestrictionMatch[1].replace('+', '').trim();

                // Проверка на значение RacialRestriction
                if (racialValue === '1') {
                    // Проверка Owner
                    if (ownerMatch) {
                        const ownerValue = ownerMatch[1].trim();
                        const isKling = ownerValue.includes("Kling");
                        const isDominator = /Blazer|Keller|Terron/.test(ownerValue);
                        const isCoalition = /Maloc|Peleng|People|Fei|Gaal|PirateClan/.test(ownerValue);

                        if (!isKling) { 
                            //если RacialRestriction 1 и Kling в Owner не найдено
                            result = result.replace(/, Kling/g, ''); // Удаляем Kling, если оно так оказалось после предыдущих операций обработчика
                            result += "Бонусы ММ работают только для оборудования указанных рас.\n";
                            result += "🔎ММ может попасть в выдачу на станциях с коалиционным 'standing' или может быть выдан на коалиционных планетах (если в 'Owner' присутствует коалиция). Если в расах указаны пираты - на станциях с пиратским 'standing' и пиратских планетах. Также он может выпасть с 3% шансом с пиратов указанных рас.\n";
                        } else if (isDominator && !isCoalition) {
                            //если RacialRestriction 1 и коалиции или клана в Owner не найдено
                            result += "Бонусы ММ работают только для доминаторского оборудования указанных рас.\n";
                            result += "🔎ММ может выпасть с 2% шансом с доминаторов.\n";
                        } else if (isDominator && isCoalition) {
                            //если RacialRestriction 1 и в Owner одновременно коалиция и клан
                            result += "⚠️Ошибка! При установке 'RacialRestriction=1' нельзя указывать в 'Owner' одновременно коалицию/клан и доминаторов. Требуется ручная проверка!\n";
                        } else if (!isKling && !isDominator) {
                            // если RacialRestriction 1 и в Owner ни коалиции, ни клана
                            result += "⚠️Кастомный 'Owner' при активном флаге 'RacialRestriction=1'. Требуется ручная проверка!\n";
                        }
                    }

                } else if (racialValue === '0') {
                    result += "🔎Если это оригинальный ММ, не обращайте внимания. Если это мод на ребаланс - 'RacialRestriction' 0 может использоваться для обнуления штрафа оригинала.\n";
                } else if (racialValue === '') {
                    result += "⚠️Внимание! Значение 'RacialRestriction' не найдено! Требуется ручная проверка!\n";
                } else if (!/^[01]$/.test(racialValue)) {
                    result += "⚠️Ошибка! 'RacialRestriction' не соответствует '1' или '0'! Требуется ручная проверка!\n";
                }
            }
		
				// Расчет стоимости
				if (!input.includes("Cost=")) {
					// Если выражение не найдено, продолжаем выполнение кода ниже
				} else {
					// Обработка стоимости
					const costMatch = input.match(/Cost=(-?\d+)/);
					if (costMatch) {
						const PRICE = parseInt(costMatch[1]);
						if (PRICE <= 0) {
							result += "⚠️Внимание! Числовое значение 'Cost' не соответствует ожидаемому, требуется ручная проверка.\n";
						} else if (PRICE === 100) {
						result += "🔎Если это оригинальный ММ, не обращайте внимания. Если это мод на ребаланс - 'Cost' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n";
						} else if (PRICE < 100) {
							const PR = 100 - PRICE;
							result += `Стоимость: -${PR}%\n`;
						} else {
							const PR = PRICE - 100;
							result += `Стоимость: +${PR}%\n`;
						}
					}
				}

			// Обработка Fragility
			if (fragilityMatch) {
				let B = parseInt(fragilityMatch[1].replace('+', '')); // Убираем знак +, если он есть
				if (B < 0 || isNaN(B)) {
					result += "⚠️Ошибка: 'Fragility' < 0. Рекомендуется ручная проверка.\n";
				} else if (B === 100) {
					result += "🔎Если это оригинальный ММ, не обращайте внимания. Если это мод на ребаланс - 'Fragility' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n";
				} else {
					const equipExists = equipMatch && equipMatch[1].trim();
					const hasHull = equipExists && equipExists.includes("Hull");
					const otherEquipExists = equipExists && equipExists.split(',').some(e => e.trim() !== "Hull");

					if ((hasHull && otherEquipExists) || (!equipMatch || equipMatch[1].trim() === '' || equipMatch[1].trim() === 'Any')) {
						// Чтобы выводились и сопротивления и надежность оборудования, если в Equipments есть и корпус и любое оборудование разом, либо строки Equipments в датнике нет или в Equipments нет ничего после знака = (что игра для ММ трактует как Any).
						if (B === 0) {
							result += "Иммунитет к э/о/р урону.\n";
							result += "Надежность: вечная.\n";
						} else {					
							const Y = (B > 100) ? (100 - B) * -1 : (100 - B);
							let reliabilityX = (B > 100) ? (100 / B * 100) - 100 : (100 / B * 100) - 100; // Вычисляем надежность без округления
							let formattedReliabilityX = (B > 199999) ? reliabilityX : reliabilityX.toFixed(1); // Округляем перед выводом, если B <= 199999, иначе выдаем неокругленное, чтобы засейвиться от значений "Надежность -100%"
							result += (B > 100) ? `Уязвимость к э/о/р урону: +${Y}%\n` : `Сопротивление э/о/р урону: +${Y}%\n`;
							result += (B > 100) ? `Надежность: ${formattedReliabilityX}%\n` : `Надежность: +${formattedReliabilityX}%\n`;
						}							
					} else if (hasHull) {
						// Если в Equipments только корпус, а оборудования нет, выводятся только данные о корпусе
						if (B === 0) {
							result += "Иммунитет к э/о/р урону.\n";
						} else {
							const Y = 100 - B;
							result += (B < 100) ? `Сопротивление э/о/р урону: +${Y}%\n` : `Уязвимость к э/о/р урону: +${(Y) * -1}%\n`;
						}
					} else if (otherEquipExists) {
						// Если в Equipments только оборудование, а корпуса не прописано, выводятся только данные о надежности оборудования
						const reliabilityX = (B > 100) ? (100 / B * 100) - 100 : (100 / B * 100) - 100;
						let formattedReliabilityX = (B > 199999) ? reliabilityX : reliabilityX.toFixed(1); // Округляем перед выводом, если B <= 199999, иначе выдаем неокругленное, чтобы засейвиться от значений "Надежность -100%"
						result += (B === 0) ? "Надежность: вечная.\n" : (formattedReliabilityX > 0 ? `Надежность: +${formattedReliabilityX}%\n` : `Надежность: ${formattedReliabilityX}%\n`);
					}
				}
			} else if (input.includes("Fragility=")) {
				result += "⚠️Ошибка! Значение 'Fragility' не указано. Требуется ручная проверка.\n";
			}

			// Обработка FragilityEnergy
			const fragilityEnergyMatch = input.match(/FragilityEnergy=\+?(-?\d+)/);
			if (fragilityEnergyMatch) {
				let ENR = parseInt(fragilityEnergyMatch[1].replace('+', '')); // Убираем знак +, если он есть
				const equipExists = equipMatch && equipMatch[1].trim();
				const hasHull = equipExists && equipExists.includes("Hull");

				if (hasHull) {
					if (ENR > 0 && ENR < 100) {
						const Y = 100 - ENR;
						result += `Сопротивление к энерг. урону: +${Y}%\n`;
					} else if (ENR > 100) {
						const Y = (100 - ENR) * -1;
						result += `Уязвимость к энерг. урону: +${Y}%\n`;
					} else if (ENR === 0) {
						result += "Иммунитет к энерг. урону\n";
					} else if (ENR < 0) {
						result += "⚠️Ошибка: 'FragilityEnergy' < 0. Рекомендуется ручная проверка.\n";
					} else if (ENR === 100) {
						result += "🔎Если это оригинальный ММ, не обращайте внимания. Если это мод на ребаланс - 'FragilityEnergy' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n";
					}
				}
			} else if (input.includes("FragilityEnergy=")) {
				// Если строка FragilityEnergy найдена, но значение не указано
				const equipExists = equipMatch && equipMatch[1].trim();
				const hasHull = equipExists && equipExists.includes("Hull");
				if (hasHull) {
					result += "⚠️Ошибка! Значение 'FragilityEnergy' не указано. Требуется ручная проверка\n";
				}
			}
			
			// Обработка FragilitySplinter
			const FragilitySplinterMatch = input.match(/FragilitySplinter=\+?(-?\d+)/);
			if (FragilitySplinterMatch) {
				let SPL = parseInt(FragilitySplinterMatch[1].replace('+', '')); // Убираем знак +, если он есть
				const equipExists = equipMatch && equipMatch[1].trim();
				const hasHull = equipExists && equipExists.includes("Hull");

				if (hasHull) {
					if (SPL > 0 && SPL < 100) {
						const Y = 100 - SPL;
						result += `Сопротивление к оскол. урону: +${Y}%\n`;
					} else if (SPL > 100) {
						const Y = (100 - SPL) * -1;
						result += `Уязвимость к оскол. урону: +${Y}%\n`;
					} else if (SPL === 0) {
						result += "Иммунитет к оскол. урону\n";
					} else if (SPL < 0) {
						result += "⚠️Ошибка: 'FragilitySplinter' < 0. Рекомендуется ручная проверка.\n";
					} else if (SPL === 100) {
						result += "🔎Если это оригинальный ММ, не обращайте внимания. Если это мод на ребаланс - 'FragilitySplinter' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n";
					}
				}
			} else if (input.includes("FragilitySplinter=")) {
				// Если строка FragilitySplinter найдена, но значение не указано
				const equipExists = equipMatch && equipMatch[1].trim();
				const hasHull = equipExists && equipExists.includes("Hull");
				if (hasHull) {
					result += "⚠️Ошибка! Значение 'FragilitySplinter' не указано. Требуется ручная проверка\n";
				}
			}
			
			// Обработка FragilityMissile
			const FragilityMissileMatch = input.match(/FragilityMissile=\+?(-?\d+)/);
			if (FragilityMissileMatch) {
				let MSL = parseInt(FragilityMissileMatch[1].replace('+', '')); // Убираем знак +, если он есть
				const equipExists = equipMatch && equipMatch[1].trim();
				const hasHull = equipExists && equipExists.includes("Hull");

				if (hasHull) {
					if (MSL > 0 && MSL < 100) {
						const Y = 100 - MSL;
						result += `Сопротивление к ракетн. урону: +${Y}%\n`;
					} else if (MSL > 100) {
						const Y = (100 - MSL) * -1;
						result += `Уязвимость к ракетн. урону: +${Y}%\n`;
					} else if (MSL === 0) {
						result += "Иммунитет к ракетн. урону\n";
					} else if (MSL < 0) {
						result += "⚠️Ошибка: 'FragilityMissile' < 0. Рекомендуется ручная проверка.\n";
					} else if (MSL === 100) {
						result += "🔎Если это оригинальный ММ, не обращайте внимания. Если это мод на ребаланс - 'FragilityMissile' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n";
					}
				}
			} else if (input.includes("FragilityMissile=")) {
				// Если строка FragilityMissile найдена, но значение не указано
				const equipExists = equipMatch && equipMatch[1].trim();
				const hasHull = equipExists && equipExists.includes("Hull");
				if (hasHull) {
					result += "⚠️Ошибка! Значение 'FragilityMissile' не указано. Требуется ручная проверка\n";
				}
			}
				
           // Обработка Size
            if (sizeMatch) {
                const sizeValue = parseInt(sizeMatch[1]);
                if (sizeValue <= 0) {
                    result += "⚠️Внимание! Значение 'Size' не может быть <= 0!\n";
                } else if (sizeValue > 100) {
                    result += `Размер: +${sizeValue - 100}%\n`;
                } else if (sizeValue > 0 && sizeValue < 100) {
                    result += `Размер: -${100 - sizeValue}%\n`;
                } else if (sizeValue === 100) {
                    result += `🔎Если это оригинальный ММ, не обращайте внимания. Если это мод на ребаланс - 'Size' 100 может использоваться для обнуления бонуса/штрафа оригинала.\n`;
                }
            }
					
			// Обработка bonHull
			const bonHullMatch = input.match(/bonHull=\+?(-?\d+)/);
			if (bonHullMatch) {
				const A = parseInt(bonHullMatch[1]);
				if (A > 0) {
					result += `Броня корпуса: +${A} ед.\n`;
				} else if (A < 0) {
					result += `Броня корпуса: ${A} ед.\n`;
				} else if (A === 0) {
					result += `🔎Если это оригинальный ММ, не обращайте внимания. Если это мод на ребаланс - 'bonHull' 0 может использоваться для обнуления бонуса/штрафа оригинала.\n`;
				}
			} else if (input.includes("bonHull=")) {
				if (input.match(/bonHull=\s*/)) {
					result += "⚠️Внимание! Значение 'bonHull' не соответствует ожидаемому! Требуется ручная проверка!\n";
				} else {
					result += "⚠️Внимание! Значение 'bonHull' не найдено! Требуется ручная проверка!\n";
				}
			}
			
			// Обработка bonMass
            const bonMassMatch = input.match(/bonMass=\+?(-?\d+)/);
            if (bonMassMatch) {
                const MBS = parseInt(bonMassMatch[1]);
                if (MBS === 0) {
